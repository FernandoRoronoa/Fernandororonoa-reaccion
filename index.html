<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HoyTeReacciono - Directo</title>
<style>
:root{--bg:#0e0d12;--panel:#17151e;--panel2:#1f1c29;--line:#2c2839;--text:#f1eef8;--mute:#9a94ad;--accent:#9146ff;--accent2:#b58bff;--ok:#3ddc97;--bad:#ff6b6b}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:flex;flex-direction:column;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;font-weight:800}
.live{margin-left:6px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--panel2);color:var(--mute);border:1px solid var(--line)}
.live.on{color:var(--ok);border-color:var(--ok)}
nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
nav a{padding:7px 14px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:14px;font-weight:600;transition:background .15s,border-color .15s}
nav a:hover{border-color:var(--accent);background:#2a2540}
nav a.patreon:hover{border-color:#ff424d}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;padding:12px;min-height:0}
main.nochat{grid-template-columns:minmax(0,1fr)}
.stage{display:flex;flex-direction:column;gap:10px;min-width:0}
.player{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9;width:100%;max-height:calc(100vh - 170px);border:1px solid var(--line)}
.player #tw,.player iframe,.player video{position:absolute;inset:0;width:100%;height:100%;border:0}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar h1{font-size:17px;flex:1;min-width:160px}
.bar h1 small{display:block;font-size:13px;font-weight:400;color:var(--mute)}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent)}
.btn.primary:hover{background:#7d33f0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel2)}
.seg button{background:none;border:0;padding:8px 13px;font-size:14px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.seg button:not([aria-pressed=true]):hover{color:var(--text)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.profile{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);background:var(--panel2);flex:none}
.pinfo{flex:1;min-width:160px}
.pinfo h1{font-size:22px;line-height:1.2;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.subbtn{font-size:14px;font-weight:700;padding:6px 16px;border-radius:8px;background:#9146ff;color:#fff;transition:background .15s}
.subbtn:hover{background:#7d33f0}
.pinfo p{font-size:14px;color:var(--mute)}
.socials{display:flex;gap:8px;flex-wrap:wrap}
.soc{padding:8px 18px;border-radius:8px;font-weight:700;font-size:14px;border:0;transition:transform .12s,filter .12s}
.soc:hover{filter:brightness(1.12);transform:translateY(-1px)}
.soc.twitch{background:#9146ff;color:#fff}
.soc.kick{background:#53fc18;color:#0b0e0a}
.soc.tiktok{background:#fe2c55;color:#fff}
.soc.patreon{background:#ff424d;color:#fff;background:linear-gradient(135deg,#f96854,#ff424d)}
.soc.discord{background:#5865f2;color:#fff}
.qnote{font-size:12px;color:var(--mute)}
aside{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:480px;height:calc(100vh - 80px);position:sticky;top:12px}
main.nochat aside{display:none}
.chead{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel2)}
.chead strong{flex:1;font-size:14px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.dot.ok{background:var(--ok)}.dot.load{background:#ffc857;animation:p 1s infinite}.dot.err{background:var(--bad)}
@keyframes p{50%{opacity:.3}}
.ib{width:34px;height:34px;border-radius:8px;border:1px solid transparent;background:none;display:grid;place-items:center}
.ib:hover{background:var(--panel);border-color:var(--line)}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.spin svg{animation:r .7s linear}
@keyframes r{to{transform:rotate(360deg)}}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel2)}
.tabs button{flex:1;padding:9px 6px;background:none;border:0;border-bottom:3px solid transparent;font-weight:700;font-size:14px;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:7px}
.tabs button[aria-selected=true]{color:var(--text)}
.tabs button[data-p=twitch][aria-selected=true]{border-color:#9146ff}
.tabs button[data-p=kick][aria-selected=true]{border-color:#53fc18}
.tabs .dot{width:7px;height:7px}
.pane{position:absolute;inset:0;display:none}
.pane.on{display:block}
.cbody{position:relative;flex:1;min-height:0}
.cbody iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#18181b}
.cover{position:absolute;inset:0;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;color:var(--mute);z-index:2}
.cover[hidden]{display:none}
.spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:r .8s linear infinite}
.cfoot{padding:8px 10px;border-top:1px solid var(--line);background:var(--panel2);font-size:12px;color:var(--mute);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cfoot button{background:none;border:0;color:var(--accent2);font-size:12px;font-weight:600;text-decoration:underline;padding:0}
.cfoot button.kbtn{background:#53fc18;color:#0b0e0a;text-decoration:none;font-size:13px;font-weight:700;padding:6px 14px;border-radius:8px}
.cfoot button.kbtn:hover{filter:brightness(1.1)}
.cfoot button[hidden],.cfoot[hidden]{display:none}
.pane[data-p=kick]{--kh:128px;--kn:110px}
/* --kh = alto de nuestra barra para escribir; --kn = alto de la caja de escribir propia de Kick (ajústalo si ves mensajes cortados o la caja de Kick asomando) */
.pane[data-p=kick] iframe{top:0;bottom:calc(var(--kh) - var(--kn));height:auto}
.kchat{position:absolute;left:0;right:0;top:0;bottom:var(--kh);overflow-y:auto;background:#0e0d12;padding:8px 0;z-index:1;overscroll-behavior:contain}
.kchat[hidden]{display:none}
.kchat:empty::before{content:"Esperando mensajes…";display:block;text-align:center;color:var(--mute);font-size:13px;padding:24px 12px}
.kmsg{padding:3px 12px;font-size:14px;line-height:1.55;word-break:break-word}
.kmsg b{font-weight:700}
.kmsg .kemote{height:28px;width:auto;vertical-align:middle;margin:0 1px}
.kwrite{position:absolute;left:0;right:0;bottom:0;height:var(--kh);z-index:3;background:var(--panel2);border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px 14px;text-align:center;font-size:13px;line-height:1.4;color:var(--mute)}
.kwrite b{color:var(--text)}
.kwrite>div{width:100%}
.kwrite #kOut{display:flex;flex-direction:column;align-items:center;gap:8px}
.kwrite .khead{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:6px;color:var(--text)}
.kwrite .klink{background:none;border:0;color:var(--accent2);font-size:12px;font-weight:600;text-decoration:underline;padding:0}
.kwrite .krow{display:flex;gap:8px}
.kwrite input{flex:1;min-width:0;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;font-size:14px}
.kwrite input:focus{outline:none;border-color:#53fc18}
.kwrite .kstat{min-height:16px;font-size:12px;margin-top:6px;text-align:left}
.kwrite .kstat.err{color:var(--bad)}.kwrite .kstat.ok{color:var(--ok)}
.kwrite [hidden]{display:none!important}
.kwrite .kbtn{background:#53fc18;color:#0b0e0a;border:0;font-size:14px;font-weight:700;padding:9px 18px;border-radius:8px}
.kwrite .kbtn:hover{filter:brightness(1.1)}
.kwrite .kemo{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:0 11px;font-size:18px;line-height:1}
.kwrite .kemo:hover{border-color:#53fc18}
#kEmotes{position:absolute;left:8px;right:8px;bottom:calc(var(--kh) + 8px);max-height:210px;overflow:auto;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:4px;z-index:4;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#kEmotes[hidden]{display:none}
#kEmotes button{background:none;border:0;padding:4px;border-radius:6px;display:grid;place-items:center}
#kEmotes button:hover{background:var(--panel)}
#kEmotes img{width:32px;height:32px;object-fit:contain}
.player .offline{position:absolute;inset:0;z-index:5;background:#2d1470}
.player .offline[hidden]{display:none}
.player .offline img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
#twStatus{position:fixed;right:0;bottom:0;width:400px;height:300px;opacity:.01;pointer-events:none;z-index:-1}
.showchat{display:none}
main.nochat .showchat{display:inline-flex}
footer{padding:12px 20px;border-top:1px solid var(--line);color:var(--mute);font-size:13px;text-align:center}
@media(max-width:960px){
main{grid-template-columns:1fr}
aside{position:static;height:560px;min-height:0}
.player{max-height:none}
nav{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

/* ========================= */

const $ = id => document.getElementById(id);
const PARENT = location.hostname || "localhost";

$("followers").textContent = FOLLOWERS;
$("followers").hidden = !FOLLOWERS;
$("lnkSub").href = "https://www.twitch.tv/hoytereacciono";
if (AVATAR_URL) $("avatar").src = AVATAR_URL;
$("lnkTwitch").href = "https://www.twitch.tv/" + CHANNEL;
$("lnkKick").href = "https://kick.com/" + KICK_CHANNEL;
$("lnkTiktok").href = LINKS.tiktok;
$("lnkPatreon").href = LINKS.patreon;
$("lnkDiscord").href = LINKS.discord;

/* ---------- Reproductor (VDO.Ninja) ---------- */
$("okplayer").src = STREAM_URL;
$("liveTag").textContent = "Baja latencia";

/* ---------- Overlay de offline (detecta si el canal de Twitch está en directo) ---------- */
(function(){
  const ok = $("okplayer"), ov = $("offline"), tag = $("liveTag");
  let state = null;
  function setLive(live){
    if (state === live) return;
    state = live;
    ov.hidden = live;
    if (live) { if (ok.getAttribute("src") !== STREAM_URL) ok.src = STREAM_URL; }
    else ok.src = "about:blank";          /* así no suena el video por debajo del overlay */
    tag.textContent = live ? "En directo" : "Offline";
    tag.classList.toggle("on", live);
  }

  if (OFFLINE_FORCE === "offline") return setLive(false);
  if (OFFLINE_FORCE === "live") return setLive(true);

  /* Fuente 1: consulta pública del tiempo en directo del canal (se repite cada minuto) */
  async function check(){
    try {
      const r = await fetch("https://decapi.me/twitch/uptime/" + encodeURIComponent(STATUS_CHANNEL) + "?_=" + Date.now(), { cache:"no-store" });
      const t = (await r.text()).trim();
      if (!r.ok || !t || /not be found|error|invalid|unavailable/i.test(t)) return;
      setLive(!/offline/i.test(t));
    } catch(e){}
  }
  check(); setInterval(check, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });

  /* Fuente 2: reproductor oculto de Twitch (avisa al instante cuando empieza o termina) */
  const box = document.createElement("div"); box.id = "twStatus"; document.body.appendChild(box);
  const sc = document.createElement("script");
  sc.src = "https://embed.twitch.tv/embed/v1.js";
  sc.onload = () => {
    try {
      const pl = new Twitch.Player("twStatus", { channel: STATUS_CHANNEL, parent: [PARENT], width: 400, height: 300, muted: true, autoplay: true });
      pl.addEventListener(Twitch.Player.ONLINE,  () => { setLive(true); try { pl.pause(); } catch(e){} });
      pl.addEventListener(Twitch.Player.OFFLINE, () => setLive(false));
    } catch(e){}
  };
  document.head.appendChild(sc);
  /* Si ninguna fuente responde (bloqueador de anuncios, sin conexión…) se deja el reproductor normal */
})();

/* ---------- Chat (Twitch + Kick) ---------- */
const PLATFORMS = {
  twitch:{ url:"https://www.twitch.tv/embed/"+CHANNEL+"/chat?parent="+encodeURIComponent(PARENT)+"&darkpopout",
           pop:"https://www.twitch.tv/popout/"+CHANNEL+"/chat?popout=", login:"https://www.twitch.tv/login", name:"Twitch" },
  kick:  { url:"https://kick.com/popout/"+KICK_CHANNEL+"/chat",
           pop:"https://kick.com/popout/"+KICK_CHANNEL+"/chat", name:"Kick" }
};
let active = "twitch", hiddenAt = 0;

Object.keys(PLATFORMS).forEach(k => {
  const p = PLATFORMS[k];
  p.pane = document.querySelector('.pane[data-p="'+k+'"]');
  p.frame = p.pane.querySelector("iframe");
  p.cover = p.pane.querySelector(".cover");
  p.tab = document.querySelector('.tabs button[data-p="'+k+'"]');
  p.dot = p.tab.querySelector(".dot");
  p.tries = 0; p.loaded = false; p.timer = null; p.started = false;
  p.frame.addEventListener("load", () => {
    if (p.frame.getAttribute("src") === "about:blank" || !p.frame.getAttribute("src")) return;
    p.loaded = true; p.tries = 0; clearTimeout(p.timer);
    p.cover.hidden = true; setDot(p, "ok"); updateHead();
  });
  p.pane.querySelector(".cretry").addEventListener("click", () => loadChat(k, true));
});

function setDot(p, kind){ p.dot.className = "dot " + kind; }
function cover(p, msg, failed){
  p.cover.hidden = false;
  p.cover.querySelector(".cmsg").textContent = msg;
  p.cover.querySelector(".spinner").style.display = failed ? "none" : "";
  p.cover.querySelector(".cretry").hidden = !failed;
}
function updateHead(){
  const p = PLATFORMS[active];
  $("cState").textContent = p.loaded ? "Chat de " + p.name + " conectado" : "Chat de " + p.name;
}

function loadChat(k, manual){
  const p = PLATFORMS[k];
  if (k === "kick" && !p.useFrame) { kickStart(p); return; }
  p.started = true;
  $("kChat").hidden = true; p.frame.style.display = "";
  if (manual) p.tries = 0;
  clearTimeout(p.timer);
  p.loaded = false;
  setDot(p, "load");
  cover(p, p.tries ? "Reintentando conexión ("+p.tries+"/3)…" : "Conectando con el chat de "+p.name+"…", false);
  p.frame.src = "about:blank";
  setTimeout(() => { p.frame.src = p.url; }, 80);
  p.timer = setTimeout(() => {
    if (p.loaded) return;
    if (p.tries < 3) { p.tries++; loadChat(k, false); }
    else { setDot(p, "err"); cover(p, "No se pudo cargar el chat de "+p.name+". Revisa tu conexión e inténtalo de nuevo.", true); }
  }, 9000 + p.tries * 3000);
  updateHead();
}

/* ---------- Chat de Kick propio (sin la caja de escribir de Kick) ---------- */
let kws = null, kRoom = "";
function closeKickWs(){ const w = kws; kws = null; if (w) { try { w.close(); } catch(e){} } }
function kickFallback(p){ closeKickWs(); p.useFrame = true; loadChat("kick", true); }
async function kickRoomId(){
  if (KICK_CHATROOM_ID) return String(KICK_CHATROOM_ID).trim();
  if (kRoom) return kRoom;
  try {
    const c = new AbortController(), t = setTimeout(() => c.abort(), 4000);
    const r = await fetch("https://kick.com/api/v2/channels/" + encodeURIComponent(KICK_CHANNEL), { signal: c.signal });
    clearTimeout(t);
    const d = await r.json();
    if (d && d.chatroom && d.chatroom.id) kRoom = String(d.chatroom.id);
  } catch(e){}
  return kRoom;
}
async function kickStart(p){
  p.started = true; p.loaded = false;
  clearTimeout(p.timer); closeKickWs();
  setDot(p, "load"); cover(p, "Conectando con el chat de Kick…", false);
  $("kChat").textContent = "";
  const id = await kickRoomId();
  if (!/^\d+$/.test(id)) return kickFallback(p);
  p.frame.src = "about:blank"; p.frame.style.display = "none"; $("kChat").hidden = false;
  kickConnect(p, id);
  p.timer = setTimeout(() => { if (!p.loaded) kickFallback(p); }, 10000);
  updateHead();
}
function kickConnect(p, id){
  const ws = new WebSocket("wss://ws-us2.pusher.com/app/32cbd69e4b950bf97679?protocol=7&client=js&version=8.4.0&flash=false");
  kws = ws;
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch(e){ return; }
    if (m.event === "pusher:connection_established") ws.send(JSON.stringify({ event:"pusher:subscribe", data:{ auth:"", channel:"chatrooms." + id + ".v2" } }));
    else if (m.event === "pusher:ping") ws.send(JSON.stringify({ event:"pusher:pong", data:{} }));
    else if (m.event === "pusher_internal:subscription_succeeded") {
      p.loaded = true; clearTimeout(p.timer); p.cover.hidden = true; setDot(p, "ok"); updateHead();
    }
    else if (m.event === "App\\Events\\ChatMessageEvent") {
      let d; try { d = typeof m.data === "string" ? JSON.parse(m.data) : m.data; } catch(e){ return; }
      kAdd(d);
    }
  };
  ws.onclose = () => { if (kws !== ws) return; setDot(p, "load"); setTimeout(() => { if (kws === ws) kickConnect(p, id); }, 3000); };
}
function kAdd(d){
  if (!d || !d.sender) return;
  const list = $("kChat"), near = list.scrollHeight - list.scrollTop - list.clientHeight < 80;
  const row = document.createElement("div"); row.className = "kmsg";
  const u = document.createElement("b");
  u.textContent = d.sender.username || "";
  u.style.color = (d.sender.identity && d.sender.identity.color) || "#b58bff";
  row.append(u, ": ");
  const txt = String(d.content || ""), re = /\[emote:(\d+):([^\]]*)\]/g;
  let last = 0, m;
  while ((m = re.exec(txt))) {
    if (m.index > last) row.append(txt.slice(last, m.index));
    const img = new Image(); img.src = "https://files.kick.com/emotes/" + m[1] + "/fullsize";
    img.alt = img.title = m[2]; img.className = "kemote"; row.append(img);
    last = re.lastIndex;
  }
  if (last < txt.length) row.append(txt.slice(last));
  list.append(row);
  while (list.children.length > 200) list.firstChild.remove();
  if (near) list.scrollTop = list.scrollHeight;
}

function showTab(k){
  active = k;
  Object.keys(PLATFORMS).forEach(n => {
    const p = PLATFORMS[n], on = n === k;
    p.pane.classList.toggle("on", on);
    p.tab.setAttribute("aria-selected", on);
  });
  if (!PLATFORMS[k].started) loadChat(k, true);
  updateHead(); updateFoot();
}
function updateFoot(){ $("cfoot").hidden = active === "kick"; }
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => showTab(b.dataset.p)));

$("btnRefresh").addEventListener("click", () => {
  const b = $("btnRefresh");
  b.classList.remove("spin"); void b.offsetWidth; b.classList.add("spin");
  loadChat(active, true);
});

/* Escribir en Kick: el navegador bloquea la sesión de Kick dentro de un iframe,
   así que se escribe desde la ventana del chat de Kick (ahí la sesión sí se guarda). */
function openWin(url, name, w, h){
  const x = Math.max(0, (screen.width - w) / 2), y = Math.max(0, (screen.height - h) / 2);
  const win = window.open(url, name, "width="+w+",height="+h+",left="+x+",top="+y);
  if (!win) { window.open(url, "_blank", "noopener"); return null; }
  win.focus(); return win;
}
function writeKick(){ openWin(PLATFORMS.kick.pop, "kick_chat", 440, 720); }
/* Twitch: ventana de login y recarga del chat al cerrarla */
$("btnLogin").addEventListener("click", () => {
  const k = active, p = PLATFORMS[k];
  const popup = openWin(p.login, "login_"+k, 480, 700);
  if (!popup) return;
  $("cState").textContent = "Esperando inicio de sesión…";
  const iv = setInterval(() => { if (popup.closed) { clearInterval(iv); loadChat(k, true); } }, 600);
});

/* ---------- Escribir en Kick desde la página (API oficial de Kick + Worker) ---------- */
const kOut = $("kOut"), kLogged = $("kLogged"), kMsg = $("kMsg"), kStat = $("kStat");
function kAuthGet(){ try { return JSON.parse(localStorage.getItem("kick_auth") || "null"); } catch(e){ return null; } }
function kAuthSet(a){ try { a ? localStorage.setItem("kick_auth", JSON.stringify(a)) : localStorage.removeItem("kick_auth"); } catch(e){} }
function kStatus(msg, kind){ kStat.textContent = msg || ""; kStat.className = "kstat" + (kind ? " " + kind : ""); }
function kRender(){
  const on = !!KICK_API, a = on && kAuthGet();
  kLogged.hidden = !a; kOut.hidden = !!a;
  $("btnWrite2").textContent = on ? "Iniciar sesión con Kick" : "Escribir en Kick";
  $("kOutText").textContent = on ? "Inicia sesión con tu cuenta de Kick para escribir en el chat desde aquí."
                                 : "Para escribir en Kick inicia sesión en su ventana de chat. Aquí abajo solo se puede leer.";
}
/* Al volver del login de Kick, el Worker devuelve la sesión en el # de la URL */
(function(){
  const m = location.hash.match(/kick_auth=([^&]+)/);
  if (!m) return;
  try {
    const t = JSON.parse(atob(m[1].replace(/-/g, "+").replace(/_/g, "/")));
    if (t.access_token) kAuthSet({ access_token: t.access_token, refresh_token: t.refresh_token, expires_at: Date.now() + (t.expires_in || 3600) * 1000 });
  } catch(e){}
  history.replaceState(null, "", location.pathname + location.search);
})();
async function kRefresh(){
  const a = kAuthGet();
  if (!a || !a.refresh_token) return false;
  try {
    const r = await fetch(KICK_API + "/refresh", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ refresh_token: a.refresh_token }) });
    if (!r.ok) throw new Error("refresh");
    const t = await r.json();
    kAuthSet({ access_token: t.access_token, refresh_token: t.refresh_token || a.refresh_token, expires_at: Date.now() + (t.expires_in || 3600) * 1000 });
    return true;
  } catch(e){ kAuthSet(null); return false; }
}
async function kSend(){
  const text = kMsg.value.trim();
  if (!text) return;
  const a = kAuthGet();
  if (!a) { kRender(); return; }
  if (a.expires_at - Date.now() < 60000 && !(await kRefresh())) { kRender(); kStatus("Tu sesión caducó. Inicia sesión de nuevo.", "err"); return; }
  $("kSend").disabled = true; kStatus("Enviando…");
  const post = () => fetch(KICK_API + "/send", { method:"POST", headers:{ "Content-Type":"application/json", "Authorization":"Bearer " + kAuthGet().access_token }, body: JSON.stringify({ content: text }) });
  try {
    let r = await post();
    if (r.status === 401 && await kRefresh()) r = await post();
    if (r.ok) { kMsg.value = ""; kStatus("Enviado", "ok"); setTimeout(() => kStatus(""), 2000); }
    else if (r.status === 401) { kAuthSet(null); kRender(); kStatus("Tu sesión caducó. Inicia sesión de nuevo.", "err"); }
    else kStatus("Kick no aceptó el mensaje (código " + r.status + "). Puede que el chat tenga restricciones.", "err");
  } catch(e){ kStatus("No hay conexión con el servidor del chat.", "err"); }
  $("kSend").disabled = false; kMsg.focus();
}
async function kWho(){
  const a = kAuthGet();
  if (!a || !KICK_API) return;
  try {
    const r = await fetch(KICK_API + "/me", { headers:{ "Authorization":"Bearer " + a.access_token } });
    if (r.ok) { const d = await r.json(); if (d.name) $("kUser").textContent = "Chateando como " + d.name; }
  } catch(e){}
}
$("btnWrite2").addEventListener("click", () => {
  if (KICK_API) location.href = KICK_API + "/login?return=" + encodeURIComponent(location.origin + location.pathname);
  else writeKick();
});
$("kSend").addEventListener("click", kSend);
kMsg.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); kSend(); } });
$("kLogout").addEventListener("click", () => { kAuthSet(null); kStatus(""); kRender(); });
kRender(); kWho();

/* ---------- Selector de emotes de Kick ---------- */
(function(){
  const box = $("kEmotes"), btn = $("kEmoBtn");
  KICK_EMOTES.forEach(([name, id]) => {
    const b = document.createElement("button");
    b.type = "button"; b.title = name;
    const img = document.createElement("img");
    img.src = "https://files.kick.com/emotes/" + id + "/fullsize"; img.alt = name; img.loading = "lazy";
    b.appendChild(img);
    b.addEventListener("click", () => {
      const tag = "[emote:" + id + ":" + name + "]";
      const i = kMsg.selectionStart ?? kMsg.value.length, j = kMsg.selectionEnd ?? i;
      const add = tag + " ";
      if (kMsg.value.length + add.length > kMsg.maxLength) return;
      kMsg.value = kMsg.value.slice(0, i) + add + kMsg.value.slice(j);
      kMsg.focus(); kMsg.setSelectionRange(i + add.length, i + add.length);
    });
    box.appendChild(b);
  });
  btn.addEventListener("click", e => { e.stopPropagation(); box.hidden = !box.hidden; });
  document.addEventListener("click", e => { if (!box.contains(e.target)) box.hidden = true; });
  document.addEventListener("keydown", e => { if (e.key === "Escape") box.hidden = true; });
  $("kLogout").addEventListener("click", () => { box.hidden = true; });
  if (!KICK_EMOTES.length) btn.hidden = true;
})();
$("btnPop").addEventListener("click", () => {
  if (active === "kick") writeKick(); else window.open(PLATFORMS[active].pop, "chat_"+active, "width=420,height=700");
});

/* Mostrar / ocultar chat */
function setChat(show){
  $("main").classList.toggle("nochat", !show);
  try { localStorage.setItem("chat", show ? "1" : "0"); } catch(e){}
  if (show && !PLATFORMS[active].loaded) loadChat(active, true);
}
$("btnHide").addEventListener("click", () => setChat(false));
$("showChat").addEventListener("click", () => setChat(true));

/* Recuperación automática */
window.addEventListener("online", () => Object.keys(PLATFORMS).forEach(k => PLATFORMS[k].started && loadChat(k, true)));
document.addEventListener("visibilitychange", () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (hiddenAt && Date.now() - hiddenAt > 5*60*1000 && !$("main").classList.contains("nochat")) loadChat(active, true);
});

let startHidden = false;
try { startHidden = localStorage.getItem("chat") === "0"; } catch(e){}
if (startHidden) $("main").classList.add("nochat");
else { loadChat("twitch", true); loadChat("kick", true); }
updateFoot();
</script>
